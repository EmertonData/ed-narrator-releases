[project]
name = "ed-narrator-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants drive a running ED Narrator instance through its HTTP API."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.23,<2", "httpx>=0.27"]

[project.scripts]
ed-narrator-mcp = "ed_narrator_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ed_narrator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
